[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsys"
version = "0.1.0"
description = "Durable, auditable task coordination for multiple coding agents across providers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.scripts]
agentsys = "agentsys.cli:main"

[tool.setuptools]
packages = ["agentsys"]

[tool.setuptools.package-data]
agentsys = ["ui.html"]
