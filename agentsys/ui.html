<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentsys</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%2388C0D0' stroke-width='1.4'%3E%3Ccircle cx='4' cy='4' r='2'/%3E%3Ccircle cx='12' cy='4' r='2'/%3E%3Ccircle cx='8' cy='12' r='2'/%3E%3Cpath d='M5.5 5.4 7 10.4M10.5 5.4 9 10.4M6 4h4'/%3E%3C/svg%3E">
<style>
/* Tokens mirror Cursor 2026.10 (theme-cursor + workbench --cursor-* layer). */
:root, [data-theme="dark"] {
  --base: #F0F0F0;
  --bg-editor: #181818;
  --bg-chrome: #141414;
  --bg-elevated: #1F1F1F;
  --accent: #81A1C1; --accent-fg: #191C22; --link: #81A1C1;
  --green: #3FA266; --red: #E34671; --yellow: #F1B467; --cyan: #88C0D0; --magenta: #B48EAD; --orange: #D2943E;
  --shadow-color: rgba(0,0,0,.40);
  color-scheme: dark;
}
[data-theme="light"] {
  --base: #141414;
  --bg-editor: #FCFCFC;
  --bg-chrome: #F3F3F3;
  --bg-elevated: #FFFFFF;
  --accent: #2778C1; --accent-fg: #FFFFFF; --link: #0064B0;
  --green: #00854C; --red: #CE405B; --yellow: #A46700; --cyan: #2778C1; --magenta: #7565CC; --orange: #CD4500;
  --shadow-color: rgba(0,0,0,.12);
  color-scheme: light;
}
:root {
  --text-1: var(--base);
  --text-2: color-mix(in srgb, var(--base) 74%, transparent);
  --text-3: color-mix(in srgb, var(--base) 60%, transparent);
  --text-4: color-mix(in srgb, var(--base) 56%, transparent);
  --stroke-1: color-mix(in srgb, var(--base) 20%, transparent);
  --stroke-2: color-mix(in srgb, var(--base) 12%, transparent);
  --stroke-3: color-mix(in srgb, var(--base) 8%, transparent);
  --fill-1: color-mix(in srgb, var(--base) 12%, transparent);
  --fill-2: color-mix(in srgb, var(--base) 7%, transparent);
  --fill-3: color-mix(in srgb, var(--base) 4%, transparent);
  --hover: color-mix(in srgb, var(--base) 7%, transparent);
  --selected: color-mix(in srgb, var(--base) 12%, transparent);
  --focus: color-mix(in srgb, var(--accent) 70%, transparent);
  --r-sm: 4px; --r: 6px; --r-lg: 8px; --r-xl: 12px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --fs-xs: 11px; --fs-sm: 12px; --fs: 13px; --fs-lg: 14px;
  --shadow: 0 0 8px 2px var(--shadow-color);
  --c-anthropic: #D97757; --c-openai: var(--green); --c-cursor: var(--cyan); --c-human: var(--magenta);
  --c-system: var(--text-3); --c-xai: var(--text-2); --c-google: #4285F4; --c-mock: var(--text-4);
  --warn-text: color-mix(in srgb, var(--yellow) 75%, var(--base));
}
[data-theme="light"] {
  --text-3: color-mix(in srgb, var(--base) 68%, transparent);
  --text-4: color-mix(in srgb, var(--base) 64%, transparent);
  --warn-text: color-mix(in srgb, var(--yellow) 80%, var(--base));
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: var(--fs)/18px var(--sans); color: var(--text-1); background: var(--bg-chrome);
  -webkit-font-smoothing: subpixel-antialiased; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; border-radius: var(--r-sm); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: var(--fs-sm); }
svg.ico { width: 16px; height: 16px; flex: none; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* -------- shell -------- */
.app { display: grid; height: 100vh; grid-template-rows: 35px 1fr 22px;
  grid-template-columns: 48px var(--side-w, 272px) 1fr;
  grid-template-areas: "title title title" "act side main" "status status status"; }
.app.side-hidden { --side-w: 0px; }
.titlebar { grid-area: title; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px;
  border-bottom: 1px solid var(--stroke-3); background: var(--bg-chrome); -webkit-user-select: none; user-select: none; }
.brand { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-weight: 500; }
.brand svg { color: var(--text-1); }
.command-center { margin: 0 auto; width: min(560px, 46vw); height: 24px; display: flex; align-items: center; gap: 6px;
  padding: 0 8px; border: 1px solid var(--stroke-2); border-radius: var(--r); background: var(--fill-3); color: var(--text-3);
  font-size: var(--fs-sm); }
.command-center:hover { background: var(--fill-2); color: var(--text-2); }
.command-center .kbd { margin-left: auto; }
.kbd { font: 500 var(--fs-xs)/16px var(--sans); color: var(--text-3); padding: 0 4px; border-radius: var(--r-sm);
  border: 1px solid var(--stroke-2); background: var(--fill-3); }
.title-actions { display: flex; gap: 2px; }
.icon-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: var(--r); color: var(--text-3); }
.icon-btn:hover { background: var(--hover); color: var(--text-1); }
.icon-btn[aria-pressed="true"] { color: var(--text-1); background: var(--selected); }

.activitybar { grid-area: act; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px;
  background: var(--bg-chrome); border-right: 1px solid var(--stroke-3); }
.act { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--r-lg);
  color: var(--text-4); }
.act svg.ico { width: 20px; height: 20px; }
.act:hover { color: var(--text-2); }
.act[aria-current="page"] { color: var(--text-1); }
.act[aria-current="page"]::before { content: ""; position: absolute; left: -6px; top: 8px; bottom: 8px; width: 2px;
  border-radius: 2px; background: var(--text-1); }
.act .dot { position: absolute; top: 6px; right: 6px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px;
  font: 600 9px/14px var(--sans); text-align: center; background: var(--accent); color: var(--accent-fg); }
.act-spacer { flex: 1; }

.sidebar { grid-area: side; overflow: hidden auto; background: var(--bg-chrome); border-right: 1px solid var(--stroke-3);
  min-width: 0; }
.app.side-hidden .sidebar { display: none; }
.side-head { height: 35px; display: flex; align-items: center; padding: 0 8px 0 16px; color: var(--text-3);
  font-size: var(--fs-xs); font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
.side-head .grow { flex: 1; }
.section { margin-bottom: 4px; }
.section > button.sec { width: 100%; height: 22px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 6px;
  color: var(--text-2); font-size: var(--fs-xs); font-weight: 600; }
.section > button.sec:hover { color: var(--text-1); }
.section > button.sec .chev { transition: transform .12s; color: var(--text-3); }
.section.closed > button.sec .chev { transform: rotate(-90deg); }
.section.closed .rows { display: none; }
.sec .count { margin-left: auto; color: var(--text-4); font-weight: 500; }
.row { width: 100%; height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 22px; text-align: left;
  color: var(--text-2); }
.row:hover { background: var(--hover); color: var(--text-1); }
.row[aria-selected="true"] { background: var(--selected); color: var(--text-1); }
.row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { color: var(--text-4); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }

/* -------- editor area -------- */
.main { grid-area: main; display: flex; flex-direction: column; min-width: 0; background: var(--bg-editor); }
.tabs { height: 35px; flex: none; display: flex; background: var(--bg-chrome); border-bottom: 1px solid var(--stroke-3);
  overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; min-width: 0; max-width: 240px;
  color: var(--text-3); border-right: 1px solid var(--stroke-3); white-space: nowrap; }
.tab:hover { color: var(--text-2); }
.tab[aria-selected="true"] { background: var(--bg-editor); color: var(--text-1); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--bg-editor); }
.tab .tname { overflow: hidden; text-overflow: ellipsis; }
.tab .x { width: 18px; height: 18px; display: grid; place-items: center; border-radius: var(--r-sm); color: var(--text-4); visibility: hidden; }
.tab:hover .x, .tab[aria-selected="true"] .x { visibility: visible; }
.tab .x:hover { background: var(--hover); color: var(--text-1); }
.crumbs { height: 22px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 16px; color: var(--text-3);
  font-size: var(--fs-sm); }
.crumbs svg.ico { width: 14px; height: 14px; color: var(--text-4); }
.content { flex: 1; overflow: auto; }
.page { max-width: 1120px; margin: 0 auto; padding: 16px 28px 48px; }
.page.wide { max-width: none; }

h1 { font-size: 20px; line-height: 28px; font-weight: 600; margin: 4px 0 2px; letter-spacing: -.01em; }
h2 { font-size: var(--fs); line-height: 18px; font-weight: 600; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }
h2 .hint { font-weight: 400; color: var(--text-3); font-size: var(--fs-sm); }
h2 .more { margin-left: auto; font-weight: 400; font-size: var(--fs-sm); }
.lede { color: var(--text-2); font-size: var(--fs-lg); line-height: 22px; margin: 8px 0 0; max-width: 58ch; }
.sub { color: var(--text-3); font-size: var(--fs-sm); }
.muted { color: var(--text-3); }
.faint { color: var(--text-4); }

.card { background: var(--fill-3); border: 1px solid var(--stroke-3); border-radius: var(--r-lg); }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.list { border: 1px solid var(--stroke-3); border-radius: var(--r-lg); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--stroke-3); }

.badge { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 10px;
  font-size: var(--fs-xs); font-weight: 500; color: var(--text-2); background: var(--fill-2); white-space: nowrap; }
.badge .pip { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-working { color: color-mix(in srgb, var(--accent) 75%, var(--base)); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.s-check { color: color-mix(in srgb, var(--yellow) 75%, var(--base)); background: color-mix(in srgb, var(--yellow) 12%, transparent); }
.s-good { color: color-mix(in srgb, var(--green) 65%, var(--base)); background: color-mix(in srgb, var(--green) 12%, transparent); }
.s-bad { color: color-mix(in srgb, var(--red) 65%, var(--base)); background: color-mix(in srgb, var(--red) 12%, transparent); }
.s-idle { color: var(--text-3); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border-radius: var(--r-sm);
  font: var(--fs-xs)/18px var(--mono); color: var(--text-2); background: var(--fill-2); }

.btn { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r);
  font-size: var(--fs-sm); color: var(--text-1); background: var(--fill-2); border: 1px solid var(--stroke-2); }
.btn:hover { background: var(--fill-1); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.ghost { background: none; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--hover); color: var(--text-1); }

/* provider avatar */
.av { width: 20px; height: 20px; flex: none; display: grid; place-items: center; border-radius: var(--r);
  background: var(--fill-2); color: var(--text-1); }
.av svg { width: 14px; height: 14px; }
.av.lg { width: 32px; height: 32px; border-radius: var(--r-lg); }
.av.lg svg { width: 20px; height: 20px; }
.av.sm { width: 16px; height: 16px; border-radius: var(--r-sm); background: none; }
.av.sm svg { width: 14px; height: 14px; }
.av.live { box-shadow: 0 0 0 1.5px var(--bg-editor), 0 0 0 3px var(--accent); }

/* attention */
.attn { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; }
.attn .ico-wrap { margin-top: 1px; }
.attn .what { flex: 1; min-width: 0; }
.attn .what b { font-weight: 600; }
.attn .what p { margin: 2px 0 0; color: var(--text-2); }
.cmd { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; max-width: 100%; height: 24px; padding: 0 4px 0 8px;
  border-radius: var(--r); background: var(--fill-2); border: 1px solid var(--stroke-3); font: var(--fs-sm)/22px var(--mono);
  color: var(--text-1); }
.cmd span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd button { height: 18px; padding: 0 6px; border-radius: var(--r-sm); font: var(--fs-xs)/18px var(--sans); color: var(--text-3); }
.cmd button:hover { background: var(--hover); color: var(--text-1); }
.next { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 12px; padding: 10px 12px;
  border-radius: var(--r-lg); background: var(--fill-3); border: 1px solid var(--stroke-3); }
.next b { font-weight: 600; font-size: var(--fs-sm); }
.next > span { color: var(--text-2); }
.next .cmd { margin-top: 0; }
.calm { display: flex; align-items: center; gap: 10px; padding: 12px 14px; color: var(--text-2); }

/* agent cards */
.agent { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.agent-top { display: flex; align-items: center; gap: 10px; }
.agent-name { font-weight: 600; }
.agent-top .badge { margin-left: auto; }
.agent-now { color: var(--text-2); min-height: 36px; }
.agent-now a { color: var(--text-1); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: var(--fs-sm); }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; color: var(--text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; gap: 16px; font-size: var(--fs-sm); color: var(--text-3); padding-top: 10px; border-top: 1px solid var(--stroke-3); }
.stats b { color: var(--text-1); font-weight: 600; font-variant-numeric: tabular-nums; }

/* flow */
.flow-row { display: grid; grid-template-columns: minmax(200px, 300px) 1fr; gap: 16px; align-items: center; padding: 12px 14px; }
.flow-row:hover { background: var(--fill-3); }
.flow-task { min-width: 0; text-align: left; }
.flow-task .t { display: block; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-task .m { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.chain { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 0; min-width: 0; }
.hop { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: var(--r); max-width: 240px; }
.hop .who { font-size: var(--fs-sm); color: var(--text-1); white-space: nowrap; }
.hop .did { font-size: var(--fs-sm); line-height: 16px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hop.live .who { color: var(--accent); }
.self-flag { font-size: var(--fs-xs); color: color-mix(in srgb, var(--yellow) 80%, var(--base)); font-weight: 500; }
.arrow { width: 22px; height: 12px; flex: none; color: var(--text-4); }
.dep { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--text-3); }

/* timeline */
.tl { padding: 12px 14px 8px; }
.tl-lane { display: grid; grid-template-columns: 170px 1fr; align-items: center; height: 30px; }
.tl-who { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--text-2); min-width: 0; }
.tl-who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-track { position: relative; height: 14px; border-radius: 3px; background: var(--fill-3); }
.tl-bar { position: absolute; top: 0; bottom: 0; min-width: 4px; border-radius: 3px; background: var(--c, var(--accent)); opacity: .9; }
.tl-bar:hover { opacity: 1; outline: 1px solid var(--text-1); }
.tl-bar.fail { background: var(--red); }
.tl-bar.live { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
.tl-axis { display: grid; grid-template-columns: 170px 1fr; margin-top: 4px; }
.tl-ticks { position: relative; height: 16px; font-size: var(--fs-xs); color: var(--text-4); font-variant-numeric: tabular-nums; }
.tl-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.tl-ticks span:first-child { transform: none; }
.tl-ticks span:last-child { transform: translateX(-100%); }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
th { text-align: left; font-weight: 500; color: var(--text-3); padding: 6px 10px; border-bottom: 1px solid var(--stroke-3); white-space: nowrap; }
td { padding: 6px 10px; border-bottom: 1px solid var(--stroke-3); color: var(--text-2); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--fill-3); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td .who { display: flex; align-items: center; gap: 6px; color: var(--text-1); white-space: nowrap; }

/* budget */
.bud { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.bud-top { display: flex; align-items: center; gap: 10px; }
.bud-top .acct { font-weight: 600; }
.bud-top .badge { margin-left: auto; }
.big { font-size: 22px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.big small { font-size: var(--fs); font-weight: 400; color: var(--text-3); letter-spacing: 0; }
.meter { position: relative; height: 6px; border-radius: 3px; background: var(--fill-1); overflow: visible; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--green); }
.meter i.warn { background: var(--yellow); } .meter i.over { background: var(--red); }
.meter .reserve { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--text-3); }
.note { font-size: var(--fs-sm); color: var(--text-2); padding: 8px 10px; border-radius: var(--r); background: var(--fill-2); }
.note.bad { color: var(--text-1); background: color-mix(in srgb, var(--red) 10%, transparent); }
.note.warn { color: var(--text-1); background: color-mix(in srgb, var(--yellow) 10%, transparent); }

/* activity */
.toolbar { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
.input { height: 26px; padding: 0 8px; border-radius: var(--r); border: 1px solid var(--stroke-2); background: var(--fill-3);
  color: var(--text-1); min-width: 260px; }
.input::placeholder { color: var(--text-4); }
.input:focus { outline: none; border-color: var(--focus); }
.ev { display: grid; grid-template-columns: 64px 20px 1fr auto; gap: 10px; align-items: start; padding: 7px 14px; font-size: var(--fs-sm); }
.ev:hover { background: var(--fill-3); }
.ev time { color: var(--text-4); font-variant-numeric: tabular-nums; padding-top: 1px; }
.ev .txt { color: var(--text-2); min-width: 0; }
.ev .txt b { color: var(--text-1); font-weight: 500; }
.ev .txt .why { display: block; color: var(--text-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* task detail */
.stepper { display: flex; align-items: center; gap: 0; margin: 16px 0 4px; }
.step { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--text-4); white-space: nowrap; }
.step .n { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--stroke-1);
  font-size: 10px; }
.step.done { color: var(--text-2); } .step.done .n { background: var(--green); border-color: transparent; color: var(--bg-editor); }
.step.now { color: var(--text-1); font-weight: 500; } .step.now .n { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.step.bad .n { border-color: var(--red); color: var(--red); }
.step-line { flex: 1; min-width: 16px; height: 1px; background: var(--stroke-2); margin: 0 8px; }
.step-line.done { background: var(--green); }
.cols { display: grid; grid-template-columns: 1fr 300px; gap: 24px; }
.thread { display: flex; flex-direction: column; gap: 0; }
.msg { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--stroke-3); }
.msg:first-child { border-top: 0; }
.msg-head { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--text-3); }
.msg-head b { color: var(--text-1); font-weight: 600; }
.msg-body { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-1); }

/* status bar */

  border-top: 1px solid var(--stroke-3); color: var(--text-3); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; }

  background: var(--bg-elevated); border: 1px solid var(--stroke-2); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }

  border: 1px solid var(--stroke-2); box-shadow: var(--shadow); font-size: var(--fs-sm); opacity: 0; transform: translateY(6px);
  transition: opacity .15s, transform .15s; pointer-events: none; }

<body>
<div class="app" id="app">
  <header class="titlebar">
    <div class="brand"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="4" cy="4" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="8" cy="12" r="2"/><path d="M5.5 5.4 7 10.4M10.5 5.4 9 10.4M6 4h4"/></svg><span>agentsys</span></div>

</div>
<div class="scrim" id="scrim"><div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
  <input id="pal-in" placeholder="Go to a task, agent, or view…" autocomplete="off" spellcheck="false" aria-controls="pal-list">
  <div class="pal-list" id="pal-list" role="listbox"></div>
</div></div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const ICONS = /*__ICONS__*/{};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const qs = new URLSearchParams(location.search);

/* ---------- glyphs (codicon-like, 16px) ---------- */
const G = {
  overview: '<path d="M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5H2.5zM9 9h4.5v4.5H9z"/>',
  tasks: '<path d="M2.5 4h1M2.5 8h1M2.5 12h1M6 4h7.5M6 8h7.5M6 12h7.5"/>',
  flow: '<circle cx="3.5" cy="8" r="1.7"/><circle cx="12.5" cy="3.5" r="1.7"/><circle cx="12.5" cy="12.5" r="1.7"/><path d="M5.2 8h2.3c1.6 0 2-4.5 3.3-4.5M7.5 8c1.6 0 2 4.5 3.3 4.5"/>',
  runs: '<path d="M2 3.5h7M5 8h9M2 12.5h5"/><path d="M2 2v12" stroke-opacity=".5"/>',
  budget: '<path d="M2.5 11.5a5.5 5.5 0 1 1 11 0"/><path d="m8 11.5 2.6-3.6"/><circle cx="8" cy="11.5" r=".6" fill="currentColor"/>',
  activity: '<path d="M1.5 8.5h3l2-5 3 9 2-4h3"/>',
  chev: '<path d="m4.5 6 3.5 3.5L11.5 6"/>',
  chevR: '<path d="m6 4.5 3.5 3.5L6 11.5"/>',
  x: '<path d="m4.5 4.5 7 7m0-7-7 7"/>',
  person: '<circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.6-2.5 2.6-3.8 5-3.8s4.4 1.3 5 3.8"/>',
  shield: '<path d="M8 1.8 13 3.6v4c0 3-2.1 5.4-5 6.6-2.9-1.2-5-3.6-5-6.6v-4z"/><path d="m5.8 8 1.6 1.6L10.4 6.6"/>',
  box: '<path d="M2.5 5 8 2.2 13.5 5v6L8 13.8 2.5 11z"/><path d="M2.5 5 8 7.8 13.5 5M8 7.8v6"/>',
  warn: '<path d="M8 2 14.5 13.5h-13z"/><path d="M8 6.5v3.2M8 11.4v.1"/>',
  check: '<circle cx="8" cy="8" r="6"/><path d="m5.3 8.2 1.9 1.9 3.6-3.8"/>',
  merge: '<circle cx="4.5" cy="3.5" r="1.5"/><circle cx="4.5" cy="12.5" r="1.5"/><circle cx="11.5" cy="8" r="1.5"/><path d="M4.5 5v6M4.5 5c0 2.5 2.5 3 5.5 3"/>',
  pause: '<path d="M5.5 3.5v9M10.5 3.5v9"/>',
  play: '<path d="M5 3.2v9.6L12.5 8z"/>',
  copy: '<rect x="5" y="5" width="8.5" height="8.5" rx="1.3"/><path d="M11 5V3.8c0-.7-.6-1.3-1.3-1.3H3.8c-.7 0-1.3.6-1.3 1.3v5.9c0 .7.6 1.3 1.3 1.3H5"/>',
  folder: '<path d="M1.8 4.2c0-.7.5-1.2 1.2-1.2h3l1.5 1.6h5.5c.7 0 1.2.5 1.2 1.2v6.2c0 .7-.5 1.2-1.2 1.2H3c-.7 0-1.2-.5-1.2-1.2z"/>',
  file: '<path d="M4 1.8h5.2L12.5 5v9.2H4z"/><path d="M9 1.8V5.2h3.5"/>',
  clock: '<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/>',
  arrow: '<path d="M1 6h18m-4-4 4 4-4 4"/>',
  info: '<circle cx="8" cy="8" r="6"/><path d="M8 7.2v4M8 5v.1"/>',
};
const g = (name, extra = "") => `<svg class="ico ${extra}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[name]}</svg>`;
const brand = (name) => (ICONS[name] || "").replace("<svg", '<svg class="ico" aria-hidden="true" focusable="false"').replace(/<title>.*?<\/title>/, "");

/* ---------- vocabulary ---------- */
const HARNESS = {
  claude: { name: "Claude Code", vendor: "Anthropic", icon: "claude-color", c: "--c-anthropic", provider: "anthropic" },
  codex: { name: "Codex CLI", vendor: "OpenAI", icon: "codex-color", c: "--c-openai", provider: "openai" },
  cursor: { name: "Cursor", vendor: "Anysphere", icon: "cursor", c: "--c-cursor", provider: "cursor" },
  grok: { name: "Grok", vendor: "xAI", icon: "grok", c: "--c-xai", provider: "xai" },
  gemini: { name: "Gemini", vendor: "Google", icon: "gemini-color", c: "--c-google", provider: "google" },
  human: { name: "You", vendor: "Human", glyph: "person", c: "--c-human", provider: "human" },
  system: { name: "Verifier", vendor: "agentsys", glyph: "shield", c: "--c-system", provider: "system" },
  mock: { name: "Mock", vendor: "test adapter", glyph: "box", c: "--c-mock", provider: "mock" },
};
const PROVIDER = {
  anthropic: { name: "Anthropic", icon: "anthropic", product: "Claude" },
  openai: { name: "OpenAI", icon: "openai", product: "ChatGPT / Codex" },
  cursor: { name: "Cursor", icon: "cursor", product: "Cursor" },
  xai: { name: "xAI", icon: "xai", product: "Grok" },
  google: { name: "Google", icon: "gemini-color", product: "Gemini" },
};
const NOT_YET = [
  { name: "Grok", vendor: "xAI", icon: "grok" }, { name: "Gemini", vendor: "Google", icon: "gemini-color" },
  { name: "GitHub Copilot", vendor: "GitHub", icon: "githubcopilot" }, { name: "Mistral", vendor: "Mistral AI", icon: "mistral-color" },
  { name: "DeepSeek", vendor: "DeepSeek", icon: "deepseek-color" }, { name: "Ollama", vendor: "local models", icon: "ollama" },
];
const harnessOf = (actor) => HARNESS[(actor || "").split(":")[0]] || { name: (actor || "?").split(":")[0], vendor: "", glyph: "box", c: "--c-system" };
function who(actor) {
  const p = (actor || "?").split(":"); const h = harnessOf(actor);
  const account = p[1] && p[0] !== "system" ? p[1] : "";
  return { h, account, role: p[2] || "", label: h.name, full: actor };
}
function av(actor, cls = "", live = false) {
  const h = harnessOf(actor);
  const inner = h.icon && ICONS[h.icon] ? brand(h.icon) : g(h.glyph || "box");
  return `<span class="av ${cls}${live ? " live" : ""}" style="color:var(${h.c})" title="${esc(h.name + (h.vendor ? " · " + h.vendor : ""))}">${inner}</span>`;
}
const STATE = {
  ready: { label: "Queued", cls: "s-idle", say: "Waiting for an agent to pick it up." },
  in_progress: { label: "Working", cls: "s-working", say: "An agent is working on it." },
  blocked: { label: "Blocked", cls: "s-bad", say: "Blocked. Nobody can continue until the blocker is fixed and it’s unblocked." },
  submitted: { label: "Checking", cls: "s-check", say: "Submitted. Waiting for the automated checks (scope, syntax, secrets)." },
  verified: { label: "In review", cls: "s-check", say: "Checks passed. A different agent identity must review it; whoever claimed, checkpointed or submitted it can’t approve it." },
  changes_requested: { label: "Changes requested", cls: "s-bad", say: "A reviewer asked for changes. Read the review, then dispatch it again." },
  accepted: { label: "Accepted", cls: "s-good", say: "Reviewed and accepted." },
  merged: { label: "Merged", cls: "s-good", say: "Merged into the target branch." },
  escalated: { label: "Needs you", cls: "s-bad", say: "Out of attempts. A human has to decide what happens next." },
  cancelled: { label: "Cancelled", cls: "s-idle", say: "Cancelled." },
};
const stateBadge = (s) => { const m = STATE[s] || { label: s, cls: "" }; return `<span class="badge ${m.cls}"><span class="pip"></span>${esc(m.label)}</span>`; };
const GROUPS = [
  ["Needs you", ["escalated", "blocked"]], ["Working", ["in_progress"]], ["Checking & review", ["submitted", "verified", "changes_requested"]],
  ["Queued", ["ready"]], ["Done", ["accepted", "merged"]], ["Cancelled", ["cancelled"]],
];

/* ---------- formatting ---------- */
const nowS = () => (S.data ? S.data.now + (Date.now() - S.fetchedAt) / 1000 : Date.now() / 1000);
function rel(ts) {
  if (!ts) return "—"; const s = Math.max(0, nowS() - ts);
  if (s < 45) return "just now"; if (s < 90) return "1 min ago"; if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) { const h = Math.floor(s / 3600); return `${h} hr${h > 1 ? "s" : ""} ago`; }
  return new Date(ts * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
const abs = (ts) => ts ? new Date(ts * 1000).toLocaleString() : "";
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
function dur(s) { s = Math.round(s || 0); if (s < 60) return `${s}s`; const m = Math.floor(s / 60); return m < 60 ? `${m}m ${s % 60}s` : `${Math.floor(m / 60)}h ${m % 60}m`; }
function tok(n) { if (n == null) return "—"; if (n < 1000) return String(n); if (n < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, "") + "k"; return (n / 1e6).toFixed(2).replace(/0$/, "") + "M"; }
const full = (n) => n == null ? "—" : Number(n).toLocaleString();
const usd = (v) => v == null ? null : v < 0.01 ? `$${v.toFixed(4)}` : `$${v.toFixed(2)}`;
const taskById = (id) => (S.data?.tasks || []).find((t) => t.id === id);
const short = (s, n = 64) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };

/* ---------- state ---------- */
const S = {
  proj: +(localStorage.getItem("agentsys.proj") || 0), projects: [], data: null, sig: "", fetchedAt: 0, error: null,
  view: localStorage.getItem("agentsys.view") || "overview", tabs: JSON.parse(localStorage.getItem("agentsys.tabs") || "[]"),
  active: localStorage.getItem("agentsys.active") || null, detail: {}, closed: JSON.parse(localStorage.getItem("agentsys.closed") || '{"Cancelled":true}'),
  live: qs.get("live") !== "0", filter: "", expanded: {},
};
const VIEWS = [
  ["overview", "Overview", "What’s happening and what needs you"], ["flow", "Flow", "How each task moved between agents"],
  ["runs", "Runs", "Every headless run on a timeline, with tokens"], ["budget", "Budget & spend", "Usage per provider account"],
  ["activity", "Activity", "The full audit trail in plain language"],
];
function persist() {
  localStorage.setItem("agentsys.view", S.view); localStorage.setItem("agentsys.tabs", JSON.stringify(S.tabs));
  localStorage.setItem("agentsys.active", S.active || ""); localStorage.setItem("agentsys.closed", JSON.stringify(S.closed));
  localStorage.setItem("agentsys.proj", S.proj);
}

/* ---------- data ---------- */
async function getJSON(path) {
  const r = await fetch(path + (path.includes("?") ? "&" : "?") + "p=" + S.proj, { cache: "no-store" });
  if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json();
}
async function poll(force) {
  try {
    if (!S.projects.length) S.projects = await (await fetch("/api/projects")).json();
    if (S.proj >= S.projects.length) S.proj = 0;
    const d = await getJSON("/api/state");
    S.fetchedAt = Date.now(); S.error = null;
    const sig = JSON.stringify([d.tasks, d.events[0]?.id, d.runs.length, d.live, d.budgets, d.approvals]);
    const changed = sig !== S.sig; S.sig = sig; S.data = d;
    if (S.active && S.active.startsWith("t-") && (changed || force || !S.detail[S.active])) await loadDetail(S.active);
    if (changed || force) render(); else renderStatus();
  } catch (e) { S.error = e.message || String(e); renderStatus(); }
}
async function loadDetail(id) { try { S.detail[id] = await getJSON("/api/task?id=" + encodeURIComponent(id)); } catch (e) { S.detail[id] = { error: e.message }; } }
let timer = null;
function schedule() { clearInterval(timer); if (S.live) timer = setInterval(() => poll(), 2000); }
setInterval(() => { if (S.data) { renderStatus(); if (!S.live) return; document.querySelectorAll("[data-rel]").forEach((el) => { el.textContent = rel(+el.dataset.rel); }); } }, 15000);

/* ---------- navigation ---------- */
function openView(v) { S.view = v; S.active = null; persist(); render(); $("#content").scrollTop = 0; }
async function openTask(id) {
  if (!S.tabs.includes(id)) S.tabs.push(id);
  S.active = id; persist(); render();
  await loadDetail(id); render(); $("#content").scrollTop = 0;
}
function closeTab(id) {
  const i = S.tabs.indexOf(id); S.tabs.splice(i, 1);
  if (S.active === id) S.active = S.tabs[i] || S.tabs[i - 1] || null;
  persist(); render();
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied to clipboard"); } catch { toast("Couldn’t copy. Select the text instead."); } }

/* ---------- derived ---------- */
function attention(d) {
  const out = [];
  for (const a of d.approvals.filter((a) => a.status === "pending"))
    out.push({ tone: "warn", title: `Approve ${a.action} for ${a.task_id}`, body: `${who(a.requested_by).label} asked: ${a.reason || "no reason given"}`, cmd: `agentsys approve ${a.id}`, task: a.task_id });
  for (const t of d.tasks.filter((t) => t.state === "escalated"))
    out.push({ tone: "bad", title: `“${short(t.title, 70)}” ran out of attempts`, body: `It failed ${t.attempts} of ${t.max_attempts} attempts. Read its blockers. Then requeue it to try again, or cancel it if the goal no longer applies.`, cmd: `agentsys show ${t.id}`, task: t.id });
  for (const t of d.tasks.filter((t) => t.state === "blocked"))
    out.push({ tone: "bad", title: `“${short(t.title, 70)}” is blocked`, body: `Read the latest blocker note and fix the cause, then run agentsys unblock ${t.id} to put it back in the queue.`, cmd: `agentsys show ${t.id}`, task: t.id });
  for (const t of d.tasks.filter((t) => t.state === "accepted" && t.kind === "implement"))
    out.push({ tone: "info", title: `“${short(t.title, 70)}” is ready to merge`, body: `Reviewed and accepted on branch ${t.branch || "agent/" + t.id}. This command checks for conflicts, then asks for your approval before merging.`, cmd: `agentsys merge-check ${t.id} && agentsys merge ${t.id}`, task: t.id });
  for (const b of d.budgets.filter((b) => b.dispatch === "refused"))
    out.push({ tone: "warn", title: `${HARNESS[b.adapter]?.name || b.provider} can’t be dispatched on ${b.account}`, body: budgetWhy(b) + " The cap is your decision. If you want to allow it, this raises it to fit the next run:", budget: true, cmd: budgetFix(b) });
  return out;
}
const roundUp = (n, step) => Math.ceil(n / step) * step;
function budgetFix(b) {
  const win = b.window_hours ? ` --window-hours ${b.window_hours}` : "";
  if (b.per_run_limit && b.next_estimate > b.per_run_limit)
    return `agentsys budget set ${b.provider} ${b.account} --limit ${b.limit || 0} --per-run ${roundUp(b.next_estimate * 1.25, 10000)}${win}`;
  const need = b.limit ? roundUp((b.used + b.next_estimate) / (1 - (b.reserve_pct || 0) / 100), 100000) : 0;
  return `agentsys budget set ${b.provider} ${b.account} --limit ${need}${b.per_run_limit ? ` --per-run ${b.per_run_limit}` : ""}${win}`;
}
function budgetWhy(b) {
  if (b.per_run_limit && b.next_estimate > b.per_run_limit)
    return `The next run is estimated at ${full(b.next_estimate)} tokens (the average of recent runs), over this account’s per-run cap of ${full(b.per_run_limit)}.`;
  if (b.limit && b.pct >= 100) return `It has used ${full(b.used)} of its ${full(b.limit)}-token cap (${b.pct}%).`;

      <dt>Spend</dt><dd>${b.spend_usd != null ? `${usd(b.spend_usd)} <span class="faint">reported by the provider</span>` : '<span class="faint">not reported by this CLI (subscription plan)</span>'}</dd>
      ${b.source ? `<dt>Set by</dt><dd>${esc(b.source)}</dd>` : ""}</dl>${note}</div>`;
}
function viewBudget(d) {
  const ad = d.harnesses || [];
  const rows = ad.map((a) => { const h = HARNESS[a.adapter] || {}; return `<div class="calm">${av(a.adapter, "")}<div style="flex:1"><div style="color:var(--text-1)">${esc(h.name || a.adapter)}</div><div class="sub">${esc(h.vendor || "")} · adapter <code>${esc(a.adapter)}</code></div></div>${a.available ? '<span class="badge s-good">Installed</span>' : '<span class="badge s-idle">Not found</span>'}</div>`; }).join("");
  const later = NOT_YET.map((n) => `<div class="calm">${ICONS[n.icon] ? `<span class="av">${brand(n.icon)}</span>` : ""}<div style="flex:1"><div style="color:var(--text-1)">${esc(n.name)}</div><div class="sub">${esc(n.vendor)}</div></div><span class="badge s-idle">No adapter yet</span></div>`).join("");
  return `<div class="page"><h1>Budget & spend</h1><p class="lede">Each provider account has its own limit; nothing is pooled between accounts. An account’s usage is counted across every project on this machine (in <code>~/.agentsys/ledger.db</code>), so a cap holds whichever repo dispatches. Limits are checked before a run starts. A CLI can’t be stopped partway through a run, so one run can go over a cap. When that happens it’s flagged here and in the run’s output.</p>
    <h2>Accounts</h2><div class="grid">${d.budgets.map(budgetCard).join("") || '<div class="card empty">No budgets set.</div>'}</div>
    <h2>Harnesses <span class="hint">CLIs agentsys can dispatch to on this machine</span></h2><div class="list">${rows}</div>
    <h2>Not connected <span class="hint">shown for reference only; nothing is sent to these</span></h2><div class="list">${later}</div>
    <p class="sub" style="margin-top:24px">Provider logos from <a href="https://github.com/lobehub/lobe-icons" target="_blank" rel="noopener">LobeHub Icons</a> (MIT). They belong to their respective owners.</p></div>`;
}

/* ---------- activity ---------- */
const EV_VERB = {
  "task.created": (e) => "created the task", "task.claim": (e) => e ? `claimed it${e.payload?.attempt > 1 ? ` (attempt ${e.payload.attempt})` : ""}` : "claimed a task",
  "task.submit": () => "submitted work", "task.verify_pass": () => "passed the automated checks", "task.verify_fail": () => "failed the automated checks",
  "task.approve": () => "approved the review", "task.reject": () => "requested changes", "task.merge": () => "merged it",
  "task.release": () => "released the task", "task.requeue": () => "requeued it", "task.escalate": () => "escalated it to you",
  "task.block": () => "marked it blocked", "task.unblock": () => "unblocked it", "task.cancel": () => "cancelled it",
  "task.worktree": () => "set up an isolated worktree", "dispatch.start": (e) => e ? `started a headless run (estimate ${tok(e.payload?.estimate)} tokens)` : "started a run",
  "dispatch.refused": () => "had a run refused by the budget", "run.recorded": (e) => e ? (e.payload?.exit ? `finished run ${e.payload.run_id} with an error (exit ${e.payload.exit})` : `finished run ${e.payload?.run_id}`) : "finished a run",
  "checkpoint": () => "saved a checkpoint", "verify.results": (e) => e ? (e.payload?.ok ? "ran checks: all passed" : "ran checks: some failed") : "ran checks",
  "merge.check": (e) => e ? (e.payload?.clean ? "checked the merge: no conflicts" : `checked the merge: ${e.payload?.conflicts?.length} conflicts`) : "checked a merge",
  "approval.requested": (e) => e ? `asked for approval to ${e.payload?.action}` : "asked for approval", "approval.granted": (e) => e ? `granted approval to ${e.payload?.action}` : "granted approval",
  "approval.denied": (e) => e ? `denied approval to ${e.payload?.action}` : "denied approval", "budget.set": (e) => e ? `set the ${e.payload?.provider}/${e.payload?.account} budget` : "set a budget",
  "task.heartbeat": () => "renewed the lease",
};
function describe(e) {
  if (e.kind.startsWith("finding.")) return `added a ${e.kind.slice(8)}`;
  const f = EV_VERB[e.kind]; return f ? f(e) : e.kind.replace(".", " ");
}
function whyOf(e) {
  const p = e.payload || {};
  if (e.kind === "budget.set") return [p.limit_tokens ? `limit ${full(p.limit_tokens)}` : "no total cap", p.per_run_limit ? `per-run ${full(p.per_run_limit)}` : "", p.window_hours ? `${p.window_hours}h window` : ""].filter(Boolean).join(" · ");
  return p.reason || p.summary || (e.kind === "task.created" ? p.title : "") || "";
}
function evRow(e) {
  const w = who(e.actor), t = e.task_id ? taskById(e.task_id) : null, why = whyOf(e);
  const tone = /fail|refused|reject|escalate|block/.test(e.kind) || e.payload?.exit ? "color:var(--red)" : "";
  return `<div class="ev"><time title="${abs(e.ts)}">${clock(e.ts)}</time>${av(e.actor, "sm")}<div class="txt"><b>${esc(w.label)}</b>${w.account ? ` <span class="faint">${esc(w.account)}</span>` : ""} <span style="${tone}">${esc(describe(e))}</span>${why ? `<span class="why" title="${esc(why)}">${esc(why)}</span>` : ""}</div>${t ? `<a href="#" data-task="${t.id}" class="mono faint" title="${esc(t.title)}">${t.id}</a>` : "<span></span>"}</div>`;
}
function viewActivity(d) {
  const f = S.filter.toLowerCase();
  const evs = d.events.filter((e) => !f || [e.actor, e.kind, e.task_id, describe(e), whyOf(e), taskById(e.task_id)?.title].join(" ").toLowerCase().includes(f));
  return `<div class="page"><h1>Activity</h1><p class="lede">Every change is logged in an append-only audit trail. Newest first, latest 120 events.</p>
    <div class="toolbar"><input class="input" id="filter" placeholder="Filter by agent, task, or action" value="${esc(S.filter)}" aria-label="Filter activity"><span class="sub">${evs.length} shown</span></div>
    <div class="list">${evs.map(evRow).join("") || '<div class="empty">No matching events.</div>'}</div></div>`;
}

/* ---------- task detail ---------- */
const STEPS = [["Queued", ["ready"]], ["Working", ["in_progress"]], ["Checks", ["submitted"]], ["Review", ["verified", "changes_requested"]], ["Accepted", ["accepted"]], ["Merged", ["merged"]]];
function stepper(t) {
  const steps = t.kind === "implement" ? STEPS : STEPS.slice(0, 5);
  let at = steps.findIndex(([, s]) => s.includes(t.state));
  const bad = ["blocked", "escalated", "cancelled", "changes_requested"].includes(t.state);
  if (at < 0) at = t.state === "cancelled" ? -1 : 1;
  return `<div class="stepper" aria-label="Progress">${steps.map(([name], i) => {
    const cls = i < at || (i === at && ["accepted", "merged"].includes(t.state) && i === steps.length - 1) ? "done" : i === at ? (bad ? "now bad" : "now") : "";
    return `${i ? `<span class="step-line ${i <= at ? "done" : ""}"></span>` : ""}<span class="step ${cls}"><span class="n">${cls === "done" ? "✓" : i + 1}</span>${name}</span>`;
  }).join("")}</div>`;
}
function viewTask(id) {
  const D = S.detail[id], t = D?.task || taskById(id);
  if (!t) return `<div class="page"><div class="empty"><b>Task not found</b>It may belong to another project.</div></div>`;
  const live = S.data.live.find((l) => l.task_id === id), chain = S.data.flows[id] || [];
  let say = STATE[t.state]?.say || "";
  if (t.state === "in_progress" && t.owner) say = `${who(t.owner).label}${who(t.owner).account ? " (" + who(t.owner).account + ")" : ""} is working on it${live ? `, with a run going for ${dur(nowS() - live.since)}` : ""}.`;
  const [nextTxt, nextCmd] = nextStep(t);
  let h = `<div class="page"><div style="display:flex;align-items:center;gap:8px">${stateBadge(t.state)}<span class="chip">${esc(t.kind)}</span><span class="mono faint">${esc(t.id)}</span></div>
    <h1>${esc(t.title)}</h1><p class="lede" style="font-size:var(--fs);line-height:20px">${esc(say)}</p>
    <div class="next"><b>Next</b><span>${esc(nextTxt)}</span>${nextCmd ? `<div class="cmd"><span>${esc(nextCmd)}</span><button data-copy="${esc(nextCmd)}" aria-label="Copy command">Copy</button></div>` : ""}</div>
    ${t.state !== "cancelled" ? stepper(t) : ""}`;
  if (chain.length) h += `<h2>Handoffs</h2><div class="list">${flowRow(t)}</div>`;
  h += `<div class="cols"><div>`;
  if (t.goal || t.acceptance) h += `<h2>Goal</h2><div class="msg-body" style="color:var(--text-2)">${esc(t.goal)}${t.acceptance ? `\n\nDone when: ${esc(t.acceptance)}` : ""}</div>`;
  if (!D) h += `<div class="empty">Loading details…</div>`;
  else if (D.error) h += `<div class="empty"><b>Couldn’t load details</b>${esc(D.error)}</div>`;
  else {
    const fs = D.findings;
    h += `<h2>Notes from agents <span class="hint">${fs.length} findings, decisions and outputs, oldest first</span></h2>`;
    h += fs.length ? `<div class="thread">${fs.map(msg).join("")}</div>` : `<div class="card empty">No notes yet. Agents record findings with <code>agentsys finding</code>.</div>`;
    h += `<h2>Audit trail <span class="hint">${D.events.length} events</span></h2><details class="card" style="padding:4px 0"><summary style="padding:6px 14px">${g("chevR", "chev")}Show every event</summary><div style="margin-top:4px">${D.events.map(evRow).join("")}</div></details>`;
  }
  h += `</div><aside>`;
  h += `<div class="card side-card"><h3>Details</h3><dl class="kv">
    <dt>${t.state === "in_progress" ? "Owner" : "Last held by"}</dt><dd>${t.owner ? `${esc(who(t.owner).label)} <span class="faint">${esc(t.owner)}</span>` : '<span class="faint">nobody</span>'}</dd>
    <dt>Attempts</dt><dd>${t.attempts} of ${t.max_attempts}</dd>
    <dt>Created</dt><dd title="${abs(t.created_at)}">${rel(t.created_at)} by ${esc(who(t.created_by).label)}</dd>
    <dt>Updated</dt><dd title="${abs(t.updated_at)}" data-rel="${t.updated_at}">${rel(t.updated_at)}</dd>
    ${t.branch ? `<dt>Branch</dt><dd class="mono" title="${esc(t.branch)}">${esc(t.branch)}</dd>` : ""}
    ${t.base ? `<dt>Base</dt><dd class="mono">${esc(String(t.base).slice(0, 10))}</dd>` : ""}
    ${(t.deps || []).length ? `<dt>After</dt><dd>${t.deps.map((x) => `<a href="#" data-task="${x}">${esc(x)}</a>`).join(", ")}</dd>` : ""}</dl></div>`;
  h += `<div class="card side-card"><h3>Allowed to change</h3>${(t.allowed_paths || []).length ? t.allowed_paths.map((p) => `<div class="mono" style="color:var(--text-2);overflow-wrap:anywhere">${esc(p)}</div>`).join("") : '<div class="sub">Nothing. This is read-only research.</div>'}
    ${(t.checks || []).length ? `<h3 style="margin-top:12px">Extra checks</h3>${t.checks.map((c) => `<div class="mono" style="color:var(--text-2);overflow-wrap:anywhere">${esc(c)}</div>`).join("")}` : ""}</div>`;
  if (D && !D.error) {
    if (D.runs.length) h += `<div class="card side-card"><h3>Runs</h3>${D.runs.map((r) => `<div style="display:flex;align-items:center;gap:8px;padding:3px 0">${av(`${r.adapter}:${r.account}`, "sm")}<span style="flex:1;color:var(--text-2)">${esc(r.model || r.adapter)}</span><span class="sub">${dur(r.ts_end - r.ts_start)} · ${tok(r.total)}</span>${r.exit_code ? `<span class="badge s-bad">exit ${r.exit_code}</span>` : ""}</div>`).join("")}</div>`;
    if (D.checkpoints.length) h += `<div class="card side-card"><h3>Checkpoints</h3>${D.checkpoints.map((c) => `<div style="padding:4px 0"><div style="display:flex;gap:6px;align-items:center">${c.verified ? `<span style="color:var(--green)">${g("check")}</span>` : `<span class="faint">${g("clock")}</span>`}<span class="mono faint">${esc((c.commit_sha || "no commit").slice(0, 8))}</span><span class="sub" style="margin-left:auto" title="${abs(c.ts)}">${rel(c.ts)}</span></div><div style="color:var(--text-2);font-size:var(--fs-sm);margin-top:2px">${esc(short(c.summary, 120))}</div></div>`).join("")}</div>`;
    if (D.approvals?.length) h += `<div class="card side-card"><h3>Approvals</h3>${D.approvals.map((a) => `<div style="padding:3px 0;color:var(--text-2)">${esc(a.action)}: <b style="color:var(--text-1)">${esc(a.status)}</b>${a.decided_by ? ` by ${esc(who(a.decided_by).label)}` : ""}</div>`).join("")}</div>`;
  }
  return h + `</aside></div></div>`;
}
function msg(f) {
  const w = who(f.author), long = f.body.length > 700 || f.body.split("\n").length > 10, open = S.expanded[f.id];
  let ev = []; try { ev = JSON.parse(f.evidence || "[]"); } catch { }
  return `<div class="msg">${av(f.author)}<div style="min-width:0"><div class="msg-head"><b>${esc(w.label)}</b>${w.account ? `<span>${esc(w.account)}</span>` : ""}<span class="k-${esc(f.kind)}">${esc(f.kind)}</span>${f.confidence ? `<span>${esc(f.confidence)} confidence</span>` : ""}<span style="margin-left:auto" title="${abs(f.ts)}">${rel(f.ts)}</span></div>
    <div class="msg-body${long && !open ? " clamp" : ""}">${esc(f.body)}</div>${long ? `<button class="expand" data-expand="${f.id}">${open ? "Show less" : "Show more"}</button>` : ""}
    ${ev.length ? `<div class="ev-refs">${ev.slice(0, 8).map((x) => `<span class="chip" title="${esc(x)}">${esc(short(x, 48))}</span>`).join("")}${ev.length > 8 ? `<span class="sub">+${ev.length - 8} more</span>` : ""}</div>` : ""}</div></div>`;
}

/* ---------- palette ---------- */
let palItems = [], palSel = 0;
function palOpen() { $("#scrim").classList.add("open"); const i = $("#pal-in"); i.value = ""; palRender(""); i.focus(); }
function palClose() { $("#scrim").classList.remove("open"); }
function palRender(q) {
  q = q.toLowerCase(); const d = S.data || { tasks: [], agents: [] };
  const views = VIEWS.map(([id, name, hint]) => ({ group: "Views", label: name, meta: hint, icon: g(id), run: () => openView(id) }));
  const tasks = d.tasks.map((t) => ({ group: "Tasks", label: t.title, meta: `${STATE[t.state]?.label} · ${t.id}`, icon: av(t.owner || lastActor(t.id) || "system", "sm"), run: () => openTask(t.id) }));
  const cmds = [
    { group: "Commands", label: "Toggle light / dark theme", meta: "", icon: g("overview"), run: toggleTheme },
    { group: "Commands", label: S.live ? "Pause live updates" : "Resume live updates", meta: "", icon: g(S.live ? "pause" : "play"), run: toggleLive },
    ...S.projects.filter((p) => p.id !== S.proj).map((p) => ({ group: "Commands", label: `Switch to project ${p.name}`, meta: p.root, icon: g("folder"), run: () => switchProj(p.id) })),
  ];
  palItems = [...views, ...tasks, ...cmds].filter((x) => !q || (x.label + " " + x.meta).toLowerCase().includes(q)).slice(0, 40);
  palSel = Math.min(palSel, Math.max(0, palItems.length - 1));
  let last = "", h = "";
  palItems.forEach((x, i) => { if (x.group !== last) { h += `<div class="pal-group">${x.group}</div>`; last = x.group; } h += `<button class="pal-item" role="option" data-pal="${i}" aria-selected="${i === palSel}">${x.icon}<span class="label">${esc(x.label)}</span><span class="meta">${esc(x.meta)}</span></button>`; });
  $("#pal-list").innerHTML = h || `<div class="empty">No matches</div>`;
  $("#pal-list [aria-selected=true]")?.scrollIntoView({ block: "nearest" });
}
$("#pal-in").addEventListener("input", (e) => { palSel = 0; palRender(e.target.value); });
$("#pal-in").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); palSel = (palSel + (e.key === "ArrowDown" ? 1 : -1) + palItems.length) % Math.max(1, palItems.length); palRender(e.target.value); }
  else if (e.key === "Enter" && palItems[palSel]) { const it = palItems[palSel]; palClose(); it.run(); }
  else if (e.key === "Escape") palClose();
});
$("#scrim").addEventListener("mousedown", (e) => { if (e.target.id === "scrim") palClose(); });
$("#pal-list").addEventListener("click", (e) => { const b = e.target.closest("[data-pal]"); if (b) { const it = palItems[+b.dataset.pal]; palClose(); it.run(); } });

/* ---------- actions ---------- */
function toggleTheme() { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; localStorage.setItem("agentsys.theme", t); }
function toggleLive() { S.live = !S.live; schedule(); if (S.live) poll(true); renderStatus(); toast(S.live ? "Live updates on" : "Live updates paused"); }
function switchProj(id) { S.proj = id; S.tabs = []; S.active = null; S.detail = {}; S.sig = ""; persist(); poll(true); }
function toggleSide() { const a = $("#app"); a.classList.toggle("side-hidden"); $("#btn-side").setAttribute("aria-pressed", !a.classList.contains("side-hidden")); }
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-close],[data-copy],[data-expand],[data-task],[data-view],[data-sec],[data-proj],[data-agent],[data-action]");
  if (!el) return;
  if (el.tagName === "A") e.preventDefault();
  const ds = el.dataset;
  if (ds.close) { e.stopPropagation(); return closeTab(ds.close); }
  if (ds.copy) return copy(ds.copy);
  if (ds.expand) { S.expanded[ds.expand] = !S.expanded[ds.expand]; return renderMain(); }
  if (ds.task) return openTask(ds.task);
  if (ds.view) return openView(ds.view);
  if (ds.sec) { S.closed[ds.sec] = !S.closed[ds.sec]; persist(); return renderSide(); }
  if (ds.proj) return switchProj(+ds.proj);
  if (ds.agent) { S.filter = who(ds.agent).label; S.view = "activity"; S.active = null; persist(); return render(); }
  if (ds.action === "live") return toggleLive();
  if (ds.action === "retry") return poll(true);
});
document.addEventListener("input", (e) => { if (e.target.id === "filter") { S.filter = e.target.value; renderMain(); } });
document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); $("#scrim").classList.contains("open") ? palClose() : palOpen(); }
  else if (mod && e.key.toLowerCase() === "b") { e.preventDefault(); toggleSide(); }
  else if (e.key === "Enter" && e.target.classList?.contains("tab")) e.target.click();
  else if (!mod && !e.altKey && /^[1-5]$/.test(e.key) && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) openView(VIEWS[+e.key - 1][0]);
});
$("#cc").addEventListener("click", palOpen);
$("#btn-theme").addEventListener("click", toggleTheme);
$("#btn-side").addEventListener("click", toggleSide);

const saved = qs.get("theme") || localStorage.getItem("agentsys.theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
document.documentElement.dataset.theme = saved;
if (S.active === "") S.active = null;
if (qs.get("view") && VIEWS.some((v) => v[0] === qs.get("view"))) { S.view = qs.get("view"); S.active = null; }
if (qs.get("task")) { S.active = qs.get("task"); if (!S.tabs.includes(S.active)) S.tabs.push(S.active); }
poll(true); schedule();
</script>
</body>
