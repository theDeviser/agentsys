name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Docs drift
        run: python3 scripts/check_docs_drift.py
      - name: Changelog site
        run: python3 scripts/build_changelog_site.py
      - name: Install links
        run: python3 scripts/check_install_links.py
      - name: Ruff
        run: pip install ruff && ruff check agentsys tests scripts
      - name: Build sdist/wheel
        run: |
          python -m pip install -U pip setuptools wheel build
          python -m build
