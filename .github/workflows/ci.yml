name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: python -m unittest discover -s tests -v
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Ruff
        run: pip install ruff && ruff check agentsys tests scripts
      - name: Docs drift
        run: python scripts/check_docs_drift.py
      - name: Install links
        run: python scripts/check_install_links.py
      - name: Changelog site is up to date
        run: python scripts/build_changelog_site.py && git diff --exit-code site/changelog.html
      - name: Docs site is up to date
        run: python scripts/build_docs_site.py && git diff --exit-code site/docs
      - name: Build sdist and wheel
        run: pip install build && python -m build
